<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://www.google.com/recaptcha/api.js?onload=onloadCallback' async defer></script><style>body {   margin: 0;   padding: 0;   background: #f9f9f9;   display: flex;   justify-content: center;   align-items: center;   height: 78px;   overflow: hidden;}.g-recaptcha {  transform: scale(0.9);  transform-origin: center;}</style></head><body><div id='recaptcha-container'></div><script>console.log('🔧 Script CAPTCHA chargé');var onloadCallback = function() {  console.log('✅ reCAPTCHA API chargée');  try {    grecaptcha.render('recaptcha-container', {      'sitekey': '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI',      'callback': onSuccess,      'error-callback': onError    });    console.log('✅ Widget CAPTCHA rendu');  } catch(e) {    console.error('❌ Erreur render:', e);    alert('Erreur render: ' + e.message);  }};function onSuccess(token) {  console.log('✅ CAPTCHA résolu, token:', token.substring(0, 20));  if (window.javaConnector) {    console.log('📤 Envoi token à Java');    window.javaConnector.captchaVerified(token);  } else {    console.error('❌ javaConnector introuvable');    alert('javaConnector introuvable');  }}function onError(error) {  console.error('❌ Erreur CAPTCHA:', error);  alert('Erreur CAPTCHA: ' + error);}</script></body></html>
